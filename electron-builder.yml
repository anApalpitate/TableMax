appId: local.tablemax.desktop
productName: TableMax
electronVersion: 44.5.1
asar: true
npmRebuild: false
directories:
  output: ../../artifacts/releases
files:
  - main.cjs
  - preload.cjs
  - server.cjs
  - bot-worker.cjs
  - web/**/*
  - package.json
win:
  target:
    - target: zip
      arch: x64
  signAndEditExecutable: false
artifactName: TableMax-${version}-win-x64.zip
