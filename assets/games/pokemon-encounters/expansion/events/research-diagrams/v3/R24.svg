<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
<title id="title">R24 隐匿者协会</title>
<desc id="desc">强制揭牌前有一整行的三张牌都保持暗置。该行所有牌在结算时的计分贡献分别除以 2，并向下取整。 九宫格为示例，点表示不限位置。</desc>
<rect width="900" height="1000" rx="32" fill="#fffaf0"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="36" y="30" width="94" height="48" rx="16" fill="#1d6250"/>
<text x="83" y="63" font-size="27" fill="#ffffff" text-anchor="middle" font-weight="700">R24</text>
<text x="154" y="63" font-size="31" fill="#243e39" text-anchor="start" font-weight="700">隐匿者协会</text>
<rect x="36" y="99" width="828" height="107" rx="20" fill="#edf4e7"/>
<text x="58" y="137" font-size="27" fill="#243e39" text-anchor="start" font-weight="500">强制揭牌前有一整行的三张牌都保持暗置。</text>
<text x="48" y="247" font-size="26" fill="#243e39" text-anchor="start" font-weight="700">九宫格示例</text>
<rect x="460" y="216" width="394" height="47" rx="16" fill="#ffe4a7"/>
<text x="657" y="249" font-size="26" fill="#243e39" text-anchor="middle" font-weight="700">暗置整行：逐牌 ÷ 2 向下取整</text>
