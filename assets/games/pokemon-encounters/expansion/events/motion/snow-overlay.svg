<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"><title>snow短演出图层候选</title><style>@keyframes drift{0%{opacity:0;transform:translate(-6px,-25px)}25%{opacity:.8}80%{opacity:.7}100%{opacity:0;transform:translate(6px,25px)}}.moving{transform-origin:300px 170px;animation:drift 1.8s ease-in-out 1 both}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none;animation:none}.still{display:block;opacity:.45}}</style><g class="moving"><g fill="#edfaff" stroke="#c2dfec" stroke-width="1"><circle cx="30" cy="25" r="3"/><circle cx="71" cy="82" r="4"/><circle cx="112" cy="139" r="5"/><circle cx="153" cy="196" r="3"/><circle cx="194" cy="253" r="4"/><circle cx="235" cy="310" r="5"/><circle cx="276" cy="77" r="3"/><circle cx="317" cy="134" r="4"/><circle cx="358" cy="191" r="5"/><circle cx="399" cy="248" r="3"/><circle cx="440" cy="305" r="4"/><circle cx="481" cy="72" r="5"/><circle cx="522" cy="129" r="3"/><circle cx="563" cy="186" r="4"/></g></g><g class="still"><g fill="#edfaff" stroke="#c2dfec" stroke-width="1"><circle cx="30" cy="25" r="3"/><circle cx="71" cy="82" r="4"/><circle cx="112" cy="139" r="5"/><circle cx="153" cy="196" r="3"/><circle cx="194" cy="253" r="4"/><circle cx="235" cy="310" r="5"/><circle cx="276" cy="77" r="3"/><circle cx="317" cy="134" r="4"/><circle cx="358" cy="191" r="5"/><circle cx="399" cy="248" r="3"/><circle cx="440" cy="305" r="4"/><circle cx="481" cy="72" r="5"/><circle cx="522" cy="129" r="3"/><circle cx="563" cy="186" r="4"/></g></g></svg>
