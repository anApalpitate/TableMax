<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"><title>mega短演出图层候选</title><style>@keyframes drift{0%{opacity:0;transform:scale(.86) rotate(-12deg)}25%{opacity:.85}75%{opacity:.65}100%{opacity:0;transform:scale(1.1) rotate(10deg)}}.moving{transform-origin:300px 170px;animation:drift 1.6s ease-in-out 1 both}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none;animation:none}.still{display:block;opacity:.45}}</style><g class="moving"><g fill="none" stroke-linecap="round"><ellipse cx="300" cy="170" rx="235" ry="85" stroke="#8feaf2" stroke-width="9" transform="rotate(-15 300 170)"/><ellipse cx="300" cy="170" rx="190" ry="108" stroke="#c0a4ed" stroke-width="7" transform="rotate(18 300 170)"/><ellipse cx="300" cy="170" rx="160" ry="55" stroke="#f5e7b4" stroke-width="5"/></g></g><g class="still"><g fill="none" stroke-linecap="round"><ellipse cx="300" cy="170" rx="235" ry="85" stroke="#8feaf2" stroke-width="9" transform="rotate(-15 300 170)"/><ellipse cx="300" cy="170" rx="190" ry="108" stroke="#c0a4ed" stroke-width="7" transform="rotate(18 300 170)"/><ellipse cx="300" cy="170" rx="160" ry="55" stroke="#f5e7b4" stroke-width="5"/></g></g></svg>
