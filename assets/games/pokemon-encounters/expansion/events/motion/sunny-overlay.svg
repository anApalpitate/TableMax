<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"><title>sunny短演出图层候选</title><style>@keyframes drift{0%{opacity:0;transform:scale(.9)}30%{opacity:.55}75%{opacity:.45}100%{opacity:0;transform:scale(1.12)}}.moving{transform-origin:300px 170px;animation:drift 1.8s ease-in-out 1 both}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none;animation:none}.still{display:block;opacity:.45}}</style><g class="moving"><g stroke="#ffe3a1" stroke-width="7" opacity=".75" stroke-linecap="round"><path d="M300 170L50 40"/><path d="M300 170L180 10"/><path d="M300 170L415 10"/><path d="M300 170L565 70"/><path d="M300 170L580 250"/><path d="M300 170L460 325"/><path d="M300 170L155 330"/><path d="M300 170L20 240"/></g></g><g class="still"><g stroke="#ffe3a1" stroke-width="7" opacity=".75" stroke-linecap="round"><path d="M300 170L50 40"/><path d="M300 170L180 10"/><path d="M300 170L415 10"/><path d="M300 170L565 70"/><path d="M300 170L580 250"/><path d="M300 170L460 325"/><path d="M300 170L155 330"/><path d="M300 170L20 240"/></g></g></svg>
