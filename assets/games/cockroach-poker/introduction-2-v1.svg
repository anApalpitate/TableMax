<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">判断或查看转传</title>
  <desc id="description">
    上方：接收扣牌后可以相信或质疑。下方：秘密查看后必须把牌转传给未看过的人；不能撤回判断。双人不能转传，最后接收者必须判断，完整规则见正文。
  </desc>
  <defs>
    <filter id="shadow" x="-35%" y="-25%" width="170%" height="165%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="4"
        flood-color="#244737"
        flood-opacity=".17"
      />
    </filter>
    <marker
      id="arrow"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="3.2"
      markerHeight="3.2"
      orient="auto-start-reverse"
    >
      <path
        d="M2 2L10 6 2 10"
        fill="none"
        stroke="#6e5689"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
    <clipPath id="back-crop">
      <polygon points="333,23 747,28 860,710 234,709" />
    </clipPath>
    <symbol id="back" viewBox="225 16 640 704">
      <image
        href="data:image/webp;base64,"
        width="1024"
        height="768"
        clip-path="url(#back-crop)"
      />
    </symbol>
    <symbol id="face" viewBox="0 0 137 220">
      <image
        href="data:image/webp;base64,"
        width="137"
        height="220"
      />
    </symbol>
  </defs>
  <rect x="3" y="3" width="474" height="314" rx="30" fill="#fbf1d9" />
  <ellipse cx="240" cy="185" rx="218" ry="110" fill="#f2e2be" />
  <g
    font-family="Microsoft YaHei UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"
  >
    <rect x="20" y="18" width="440" height="128" rx="22" fill="#fff9eb" />
    <g transform="rotate(0 74.5 82.5)">
      <use
        href="#back"
        x="46"
        y="38"
        width="57"
        height="89"
        filter="url(#shadow)"
      />
    </g>
    <path
      d="M124 81H174"
      fill="none"
      stroke="#6e5689"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <rect x="195" y="29" width="112" height="44" rx="22" fill="#e0ead5" />
    <text
      x="251"
      y="59"
      text-anchor="middle"
      font-size="25"
      font-weight="700"
      fill="#466b43"
    >
      相信
    </text>
    <rect x="323" y="29" width="112" height="44" rx="22" fill="#f1dfcf" />
    <text
      x="379"
      y="59"
      text-anchor="middle"
      font-size="25"
      font-weight="700"
      fill="#9c5d3e"
    >
      质疑
    </text>
    <text
      x="314"
      y="118"
      text-anchor="middle"
      font-size="24"
      font-weight="700"
      fill="#614774"
    >
      直接判断
    </text>
    <path
      d="M32 160H448"
      stroke="#dfcca7"
      stroke-width="2"
      stroke-dasharray="7 8"
    />
    <g transform="rotate(-5 77.5 229.5)">
      <use
        href="#face"
        x="48"
        y="182"
        width="59"
        height="95"
        filter="url(#shadow)"
      />
    </g>
    <g transform="translate(138 224) scale(0.8)">
      <path
        d="M-26 0Q0-28 26 0Q0 28-26 0Z"
        fill="#fffdf5"
        stroke="#6e5689"
        stroke-width="5"
      />
      <circle r="9" fill="#6e5689" />
    </g>
    <path
      d="M185 225H329"
      fill="none"
      stroke="#6e5689"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <g transform="translate(391 225) scale(0.85)">
      <circle r="35" fill="#d59653" stroke="#fffdf5" stroke-width="5" />
      <circle cy="-9" r="11" fill="#fffdf5" />
      <path d="M-20 21c1-25 39-25 40 0" fill="#fffdf5" />
    </g>
    <text
      x="391"
      y="291"
      text-anchor="middle"
      font-size="24"
      font-weight="700"
      fill="#28463c"
    >
      未看过的人
    </text>
    <text
      x="205"
      y="189"
      text-anchor="middle"
      font-size="23"
      font-weight="700"
      fill="#614774"
    >
      秘密查看后
    </text>
    <text
      x="225"
      y="280"
      text-anchor="middle"
      font-size="27"
      font-weight="700"
      fill="#614774"
    >
      必须转传
    </text>
  </g>
</svg>
