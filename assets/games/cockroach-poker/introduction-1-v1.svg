<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">选牌、选人、声明</title>
  <desc id="description">
    示例实际牌面为蝙蝠，传出的牌扣着；玩家声明蟑螂，可以诈唬。声明气泡属于出牌者。
  </desc>
  <defs>
    <filter id="shadow" x="-35%" y="-25%" width="170%" height="165%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="4"
        flood-color="#244737"
        flood-opacity=".17"
      />
    </filter>
    <marker
      id="arrow"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="3.2"
      markerHeight="3.2"
      orient="auto-start-reverse"
    >
      <path
        d="M2 2L10 6 2 10"
        fill="none"
        stroke="#6e5689"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
    <clipPath id="back-crop">
      <polygon points="333,23 747,28 860,710 234,709" />
    </clipPath>
    <symbol id="bat" viewBox="0 0 137 220">
      <image
        href="data:image/webp;base64,"
        width="137"
        height="220"
      />
    </symbol>
    <symbol id="claim" viewBox="0 0 137 220">
      <image
        href="data:image/webp;base64,"
        width="137"
        height="220"
      />
    </symbol>
    <symbol id="back" viewBox="225 16 640 704">
      <image
        href="data:image/webp;base64,"
        width="1024"
        height="768"
        clip-path="url(#back-crop)"
      />
    </symbol>
  </defs>
  <rect x="3" y="3" width="474" height="314" rx="30" fill="#fbf1d9" />
  <ellipse cx="240" cy="185" rx="218" ry="110" fill="#f2e2be" />
  <g
    font-family="Microsoft YaHei UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"
  >
    <g transform="translate(54 251) scale(0.65)">
      <circle r="35" fill="#8d6fa6" stroke="#fffdf5" stroke-width="5" />
      <circle cy="-9" r="11" fill="#fffdf5" />
      <path d="M-20 21c1-25 39-25 40 0" fill="#fffdf5" />
    </g>
    <g transform="rotate(-12 94.5 171.5)">
      <use
        href="#bat"
        x="52"
        y="103"
        width="85"
        height="137"
        filter="url(#shadow)"
      />
    </g>
    <rect x="30" y="34" width="138" height="44" rx="22" fill="#ede5f4" />
    <text
      x="99"
      y="64"
      text-anchor="middle"
      font-size="24"
      font-weight="700"
      fill="#62497e"
    >
      选一张牌
    </text>
    <path
      d="M157 185H330"
      fill="none"
      stroke="#6e5689"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <g transform="rotate(5 237 182)">
      <use
        href="#back"
        x="205"
        y="132"
        width="64"
        height="100"
        filter="url(#shadow)"
      />
    </g>
    <g transform="translate(390 184) scale(1.03)">
      <circle r="35" fill="#d59653" stroke="#fffdf5" stroke-width="5" />
      <circle cy="-9" r="11" fill="#fffdf5" />
      <path d="M-20 21c1-25 39-25 40 0" fill="#fffdf5" />
    </g>
    <path
      d="M168 35H338Q351 35 351 48V90Q351 103 338 103H200L178 121V103H168Q155 103 155 90V48Q155 35 168 35Z"
      fill="#fffdf5"
      stroke="#d8c3a0"
      stroke-width="2"
    />
    <g transform="rotate(0 185 68.5)">
      <use
        href="#claim"
        x="171"
        y="46"
        width="28"
        height="45"
        filter="url(#shadow)"
      />
    </g>
    <text
      x="272"
      y="77"
      text-anchor="middle"
      font-size="25"
      font-weight="700"
      fill="#614774"
    >
      我说：蟑螂
    </text>
    <text
      x="391"
      y="264"
      text-anchor="middle"
      font-size="25"
      font-weight="700"
      fill="#28463c"
    >
      任意对手
    </text>
    <text
      x="180"
      y="293"
      text-anchor="middle"
      font-size="24"
      font-weight="700"
      fill="#614774"
    >
      真话、诈唬都可以
    </text>
  </g>
</svg>
