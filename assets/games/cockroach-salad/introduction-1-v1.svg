<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">翻牌与重复改名</title>
  <desc id="description">
    重复改名示例：上一张是番茄，上一回答为番茄，无可见禁忌，本张又翻出番茄，所以改答生菜。一般情况必须如实命名。
  </desc>
  <defs>
    <filter id="shadow" x="-35%" y="-25%" width="170%" height="165%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="4"
        flood-color="#244737"
        flood-opacity=".17"
      />
    </filter>
    <marker
      id="arrow"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="3.2"
      markerHeight="3.2"
      orient="auto-start-reverse"
    >
      <path
        d="M2 2L10 6 2 10"
        fill="none"
        stroke="#3d8065"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
    <clipPath id="back-crop">
      <polygon points="333,23 747,28 860,710 234,709" />
    </clipPath>
    <symbol id="tomato" viewBox="0 0 116 220">
      <image
        href="data:image/webp;base64,"
        width="116"
        height="220"
      />
    </symbol>
    <symbol id="lettuce" viewBox="0 0 116 220">
      <image
        href="data:image/webp;base64,"
        width="116"
        height="220"
      />
    </symbol>
    <symbol id="back" viewBox="0 0 116 220">
      <image
        href="data:image/webp;base64,"
        width="116"
        height="220"
      />
    </symbol>
  </defs>
  <rect x="3" y="3" width="474" height="314" rx="30" fill="#edf4d9" />
  <ellipse cx="240" cy="185" rx="218" ry="110" fill="#dcebc3" />
  <g
    font-family="Microsoft YaHei UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"
  >
    <rect x="25" y="25" width="112" height="44" rx="22" fill="#f3e7bf" />
    <text
      x="81"
      y="55"
      text-anchor="middle"
      font-size="24"
      font-weight="700"
      fill="#80642f"
    >
      上一张
    </text>
    <rect x="157" y="25" width="112" height="44" rx="22" fill="#cfe4bc" />
    <text
      x="213"
      y="55"
      text-anchor="middle"
      font-size="24"
      font-weight="700"
      fill="#3f7055"
    >
      本张
    </text>
    <g transform="rotate(-7 82 168.5)">
      <use
        href="#tomato"
        x="47"
        y="102"
        width="70"
        height="133"
        filter="url(#shadow)"
      />
    </g>
    <g transform="rotate(-5 203 174)">
      <use
        href="#back"
        x="164"
        y="100"
        width="78"
        height="148"
        filter="url(#shadow)"
      />
    </g>
    <g transform="rotate(6 214.5 158)">
      <use
        href="#tomato"
        x="175"
        y="83"
        width="79"
        height="150"
        filter="url(#shadow)"
      />
    </g>
    <path
      d="M273 164H308"
      fill="none"
      stroke="#3d8065"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <path
      d="M340 66H437Q452 66 452 81V215Q452 230 437 230H340Q325 230 325 215V190L310 176 325 162V81Q325 66 340 66Z"
      fill="#fffdf5"
      stroke="#b8d0a0"
      stroke-width="2"
    />
    <g transform="rotate(0 386 127.5)">
      <use
        href="#lettuce"
        x="362"
        y="82"
        width="48"
        height="91"
        filter="url(#shadow)"
      />
    </g>
    <text
      x="388"
      y="207"
      text-anchor="middle"
      font-size="28"
      font-weight="700"
      fill="#3d7151"
    >
      生菜
    </text>
    <text
      x="240"
      y="285"
      text-anchor="middle"
      font-size="28"
      font-weight="700"
      fill="#3d7151"
    >
      重复了，换个菜名
    </text>
  </g>
</svg>
