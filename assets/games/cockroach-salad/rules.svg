<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220"><rect width="720" height="220" rx="24" fill="#f2f7d9"/><g font-family="sans-serif" font-size="28" text-anchor="middle" fill="#285139"><text x="100" y="72">上一张</text><text x="100" y="125">番茄</text><text x="230" y="116">→</text><text x="360" y="72">当前</text><text x="360" y="125">番茄</text><text x="490" y="116">→</text><text x="610" y="72">可改答</text><text x="610" y="125">生菜</text><text x="360" y="190" font-size="22">甜椒禁忌：不能改答甜椒；也不能重复番茄</text></g></svg>