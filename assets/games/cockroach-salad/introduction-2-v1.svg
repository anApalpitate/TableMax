<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">禁忌与换堆</title>
  <desc id="description">
    左堆打出甜椒禁忌牌，回答蟑螂。下一张移到右堆。左堆的甜椒禁忌仍然可见，所以继续生效。
  </desc>
  <defs>
    <filter id="shadow" x="-35%" y="-25%" width="170%" height="165%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="4"
        flood-color="#244737"
        flood-opacity=".17"
      />
    </filter>
    <marker
      id="arrow"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="3.2"
      markerHeight="3.2"
      orient="auto-start-reverse"
    >
      <path
        d="M2 2L10 6 2 10"
        fill="none"
        stroke="#3d8065"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
    <clipPath id="back-crop">
      <polygon points="333,23 747,28 860,710 234,709" />
    </clipPath>
    <symbol id="taboo" viewBox="0 0 116 220">
      <image
        href="data:image/webp;base64,"
        width="116"
        height="220"
      />
    </symbol>
    <symbol id="lettuce" viewBox="0 0 116 220">
      <image
        href="data:image/webp;base64,"
        width="116"
        height="220"
      />
    </symbol>
    <symbol id="back" viewBox="0 0 116 220">
      <image
        href="data:image/webp;base64,"
        width="116"
        height="220"
      />
    </symbol>
  </defs>
  <rect x="3" y="3" width="474" height="314" rx="30" fill="#edf4d9" />
  <ellipse cx="240" cy="185" rx="218" ry="110" fill="#dcebc3" />
  <g
    font-family="Microsoft YaHei UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"
  >
    <rect x="25" y="22" width="177" height="44" rx="22" fill="#fff6d5" />
    <text
      x="113.5"
      y="52"
      text-anchor="middle"
      font-size="26"
      font-weight="700"
      fill="#655732"
    >
      回答：蟑螂
    </text>
    <rect x="280" y="22" width="175" height="44" rx="22" fill="#cfe4bc" />
    <text
      x="367.5"
      y="52"
      text-anchor="middle"
      font-size="26"
      font-weight="700"
      fill="#3f7055"
    >
      下张换堆
    </text>
    <ellipse cx="110" cy="244" rx="69" ry="20" fill="#bdd29e" />
    <ellipse cx="369" cy="244" rx="69" ry="20" fill="#bdd29e" />
    <g transform="rotate(-7 110 181.5)">
      <use
        href="#back"
        x="75"
        y="115"
        width="70"
        height="133"
        filter="url(#shadow)"
      />
    </g>
    <g transform="rotate(3 111.5 166)">
      <use
        href="#taboo"
        x="73"
        y="93"
        width="77"
        height="146"
        filter="url(#shadow)"
      />
    </g>
    <path
      d="M180 162C215 126 260 126 299 160"
      fill="none"
      stroke="#3d8065"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <g transform="rotate(6 369 182.5)">
      <use
        href="#back"
        x="334"
        y="116"
        width="70"
        height="133"
        filter="url(#shadow)"
      />
    </g>
    <g transform="rotate(-5 369.5 167)">
      <use
        href="#lettuce"
        x="330"
        y="92"
        width="79"
        height="150"
        filter="url(#shadow)"
      />
    </g>
    <text
      x="240"
      y="286"
      text-anchor="middle"
      font-size="27"
      font-weight="700"
      fill="#3d7151"
    >
      可见禁忌继续生效
    </text>
  </g>
</svg>
