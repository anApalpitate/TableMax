      <circle cy="-9" r="11" fill="#fffdf5" />
      <path d="M-20 21c1-25 39-25 40 0" fill="#fffdf5" />
    </g>
    <g transform="translate(204 238) scale(0.6)">
      <circle r="35" fill="#c49465" stroke="#fffdf5" stroke-width="5" />
      <circle cy="-9" r="11" fill="#fffdf5" />
      <path d="M-20 21c1-25 39-25 40 0" fill="#fffdf5" />
    </g>
    <circle cx="38" cy="180" r="20" fill="#fffdf5" />
    <text
      x="38"
      y="188"
      text-anchor="middle"
