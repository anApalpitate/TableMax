<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">共同质疑窗口后判胜</title>
  <desc id="description">
    左侧用问号表示其他玩家尚未公开的独立选择，不展示任何已提交的他人票。右侧表示个人牌堆已经空，但必须等共同质疑窗口结算后才判定胜利；罚给作答者时不会获胜。
  </desc>
  <defs>
    <filter id="shadow" x="-35%" y="-25%" width="170%" height="165%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="4"
        flood-color="#244737"
        flood-opacity=".17"
      />
    </filter>
    <marker
      id="arrow"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="3.2"
      markerHeight="3.2"
      orient="auto-start-reverse"
    >
      <path
        d="M2 2L10 6 2 10"
        fill="none"
        stroke="#3d8065"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
    <clipPath id="back-crop">
      <polygon points="333,23 747,28 860,710 234,709" />
    </clipPath>
    <symbol id="tomato" viewBox="0 0 116 220">
      <image
        href="data:image/webp;base64,"
        width="116"
        height="220"
      />
    </symbol>
    <symbol id="back" viewBox="0 0 116 220">
      <image
        href="data:image/webp;base64,"
        width="116"
        height="220"
      />
    </symbol>
  </defs>
  <rect x="3" y="3" width="474" height="314" rx="30" fill="#edf4d9" />
  <ellipse cx="240" cy="185" rx="218" ry="110" fill="#dcebc3" />
  <g
    font-family="Microsoft YaHei UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"
  >
    <rect x="20" y="20" width="216" height="44" rx="22" fill="#fff6d5" />
    <text
      x="128"
      y="50"
      text-anchor="middle"
      font-size="24"
      font-weight="700"
      fill="#6d6137"
